services:
  db:
    build: ./database
    environment:
      MYSQL_DATABASE: borderflow
      MYSQL_USER: borderflow
      MYSQL_PASSWORD: ${DB_PASSWORD:-borderflow_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-borderflow_root_local}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 3s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    environment:
      APP_KEY: ${APP_KEY:?Copy .env.example to .env and set APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: borderflow
      DB_USERNAME: borderflow
      DB_PASSWORD: ${DB_PASSWORD:-borderflow_local}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      PHP_CLI_SERVER_WORKERS: 8
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql:
